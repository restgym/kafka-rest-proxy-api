      operationId: deleteKafkaAcls
      produces:
        - application/json
        - text/html
      parameters:
        - $ref: '#/parameters/AclResourceTypeRequired'
        - $ref: '#/parameters/AclResourceName'
        - $ref: '#/parameters/AclPatternTypeRequired'
        - $ref: '#/parameters/AclPrincipal'
        - $ref: '#/parameters/AclHost'
