      consumes:
        - application/json
      produces:
        - application/json
        - text/html
      parameters:
        - $ref: '#/parameters/CreateAclRequest'
      responses:
        "201":
          description: Created
        "400":
          $ref: '#/responses/BadRequestErrorResponse_CreateAcls'
        "401":
          $ref: '#/responses/UnauthorizedErrorResponse'
        "403":
          $ref: '#/responses/ForbiddenErrorResponse'
        "429":
