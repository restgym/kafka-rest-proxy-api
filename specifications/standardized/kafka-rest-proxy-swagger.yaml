    parameters:
      - $ref: '#/parameters/ClusterId'
  /v3/clusters/{cluster_id}/topics/{topic_name}/records:
    post:
      tags:
        - Records (v3)
      summary: Produce Records
      description: "[![Generally Available](https://img.shields.io/badge/Lifecycle%20Stage-Generally%20Available-%2345c6e8)](#section/Versioning/API-Lifecycle-Policy)\n\nProduce records to the given topic, returning delivery reports for each\n            record produced. This API can be used in streaming mode by setting \"Transfer-Encoding:\n            chunked\" header. For as long as the connection is kept open, the server will\n            keep accepting records. Records are streamed to and from the server as Concatenated \n            JSON. For each record sent to the server, the server will\n            asynchronously send back a delivery report, in the same order, each with its own\n            error_code. An error_code of 200 indicates success. The HTTP status code will be HTTP \n            200 OK as long as the connection is successfully established. To identify records\n            that have encountered an error, check the error_code of each delivery report."
      operationId: produceRecord
      consumes:
        - application/json
      produces:
        - application/json
        - text/html
      parameters:
        - $ref: '#/parameters/ProduceRequest'
      responses:
        "200":
          $ref: '#/responses/ProduceResponse'
        "401":
          $ref: '#/responses/UnauthorizedErrorResponse'
        "403":
          $ref: '#/responses/ForbiddenErrorResponse'
        "404":
          $ref: '#/responses/NotFoundErrorResponse'
        "422":
          $ref: '#/responses/UnprocessableEntity_ProduceRecord'
        "429":
          $ref: '#/responses/TooManyRequestsErrorResponse'
        5XX:
          $ref: '#/responses/ServerErrorResponse'
    parameters:
      - $ref: '#/parameters/ClusterId'
      - $ref: '#/parameters/TopicName'
  /v3/clusters/{cluster_id}/topics/{topic_name}/records:batch:
    post:
      tags:
        - Records (v3)
      summary: Produce Records Batch
      description: |-
        [![Generally Available](https://img.shields.io/badge/Lifecycle%20Stage-Generally%20Available-%2345c6e8)](#section/Versioning/API-Lifecycle-Policy)

        Produce a batch of records to the given topic, returning delivery reports for each record produced.
        To identify records that have encountered an error, check the error_code of each delivery report.
      operationId: produceRecordsBatch
      consumes:
        - application/json
      produces:
        - application/json
        - text/html
      parameters:
        - $ref: '#/parameters/ProduceBatchRequest'
      responses:
        "207":
          $ref: '#/responses/ProduceBatchResponse'
        "401":
          $ref: '#/responses/UnauthorizedErrorResponse'
        "403":
          $ref: '#/responses/ForbiddenErrorResponse'
        "404":
          $ref: '#/responses/NotFoundErrorResponse'
        "429":
          $ref: '#/responses/TooManyRequestsErrorResponse'
        5XX:
          $ref: '#/responses/ServerErrorResponse'
    parameters:
      - $ref: '#/parameters/ClusterId'
      - $ref: '#/parameters/TopicName'
