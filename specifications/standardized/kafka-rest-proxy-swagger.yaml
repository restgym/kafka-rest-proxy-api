swagger: "2.0"
info:
  title: REST Admin API
  contact:
    name: Kafka REST Team
    url: https://confluent.slack.com/app_redirect?channel=kafka-rest-eng
    email: kafka-clients-proxy-team@confluent.io
  version: 3.0.0
  x-api-id: 499e3476-71e0-4d6f-b4f9-6776cec6df27
  x-api-group: v3
  x-audience: external-public
  x-tag-group: Kafka API (%s)
host: localhost:8082
schemes:
  - http
paths:
  /v3/clusters:
    get:
      tags:
        - Cluster (v3)
      summary: List Clusters
      description: |-
        [![Generally Available](https://img.shields.io/badge/Lifecycle%20Stage-Generally%20Available-%2345c6e8)](#section/Versioning/API-Lifecycle-Policy)

        'Return a list of known Kafka clusters. Currently both Kafka and Kafka REST
        Proxy are only aware of the Kafka cluster pointed at by the
        ``bootstrap.servers`` configuration. Therefore only one Kafka cluster will be returned in the
        response.'
      operationId: listKafkaClusters
      produces:
        - application/json
        - text/html
      responses:
        "200":
          $ref: '#/responses/ListClustersResponse'
        "400":
          $ref: '#/responses/BadRequestErrorResponse'
        "401":
          $ref: '#/responses/UnauthorizedErrorResponse'
        "403":
          $ref: '#/responses/ForbiddenErrorResponse'
        "429":
          $ref: '#/responses/TooManyRequestsErrorResponse'
        5XX:
          $ref: '#/responses/ServerErrorResponse'
    x-audience: component-internal
  /v3/clusters/{cluster_id}:
    get:
      tags:
        - Cluster (v3)
      summary: Get Cluster
      description: |-
        [![Generally Available](https://img.shields.io/badge/Lifecycle%20Stage-Generally%20Available-%2345c6e8)](#section/Versioning/API-Lifecycle-Policy)

        Return the Kafka cluster with the specified ``cluster_id``.
      operationId: getKafkaCluster
      produces:
        - application/json
        - text/html
      responses:
        "200":
          $ref: '#/responses/GetClusterResponse'
        "400":
          $ref: '#/responses/BadRequestErrorResponse'
        "401":
          $ref: '#/responses/UnauthorizedErrorResponse'
        "403":
          $ref: '#/responses/ForbiddenErrorResponse'
        "429":
          $ref: '#/responses/TooManyRequestsErrorResponse'
        5XX:
          $ref: '#/responses/ServerErrorResponse'
    parameters:
      - $ref: '#/parameters/ClusterId'
