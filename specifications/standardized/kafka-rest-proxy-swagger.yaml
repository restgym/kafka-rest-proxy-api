            - id: "1"
              value:
                type: STRING
                data: My first message
            - id: "2"
              value:
                type: STRING
                data: My second message
  ProduceRequest:
    in: body
    name: body
    description: A single record to be produced to Kafka. To produce multiple records in the same request, simply concatenate the records. The delivery reports are concatenated in the same order as the records are sent.
    schema:
      $ref: '#/definitions/ProduceRequest'
    x-examples:
      binary_and_json:
        description: If using type, one of "BINARY", "JSON" or "STRING" is required.
        value:
          partition_id: 1
          headers:
            - name: Header-1
              value: SGVhZGVyLTE=
            - name: Header-2
              value: SGVhZGVyLTI=
          key:
            type: BINARY
            data: Zm9vYmFy
          value:
            type: JSON
            data:
              foo: bar
          timestamp: "2021-02-05T19:14:42Z"
      binary_and_avro_with_subject_and_raw_schema:
        description: If using type, one of "BINARY", "JSON", "STRING", or using the schema field is required.
        value:
          partition_id: 1
          headers:
            - name: Header-1
              value: SGVhZGVyLTE=
            - name: Header-2
              value: SGVhZGVyLTI=
          key:
            type: BINARY
            data: Zm9vYmFy
          value:
            type: AVRO
            subject: topic-1-key
            schema: '{\"type\":\"string\"}'
            data: foobar
          timestamp: "2021-02-05T19:14:42Z"
      string:
        description: If using type, one of "BINARY", "JSON" or "STRING" is required.
        value:
          value:
            type: STRING
            data: My message
      schema_id_and_schema_version:
        description: If not setting type, the record is assumed to use a schema. The actual schema is queried from Schema Registry based on the subject, schema_id and schema_version. You can specify the subject directly or you can use subject_name_strategy. If neither is specified, subject_name_strategy is assumed to be TOPIC_NAME. You can use either schema_id or schema_version to identify the actual schema in the subject.
        value:
          key:
            subject_name_strategy: TOPIC_NAME
            schema_id: 1
            data: 1000
          value:
            schema_version: 1
            data:
              foo: bar
      latest_schema:
        description: If neither schema_id or schema_version are specified, the latest schema for the subject is used. This should be the preferred way of using the API. You should register the schema with Schema Registry directly, then on Kafka REST you do not need to say anything about the schema and we will fetch the latest one for you.
        value:
          key:
            data: 1000
          value:
            data: foobar
      null_and_empty_data:
        description: data can be omitted or can be null.
        value:
          key:
            schema_id: 1
          value:
            schema_version: 1
            data: null
      empty_value:
        description: key or value can be omitted entirely.
        value:
          key:
            data: 1000
